<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job dashboard</title>
<style>
:root {
  --bg: #ffffff; --panel: #f7f7f8; --line: #e3e3e6; --ink: #1a1a1c; --dim: #6b6b73;
  --accent: #2f5fd0; --good: #177a4a; --warn: #9a6400; --bad: #a8332a; --flag: #fff4d6;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131316; --panel: #1b1b1f; --line: #2c2c32; --ink: #e8e8ea; --dim: #9a9aa4;
    --accent: #7aa2f7; --good: #5cc98d; --warn: #e0b34a; --bad: #f07a71; --flag: #3a3116;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); display: flex;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
nav {
  width: 190px; min-height: 100vh; padding: 20px 12px; border-right: 1px solid var(--line);
  background: var(--panel); position: sticky; top: 0; flex: none;
}
nav h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin: 0 0 14px 8px; }
nav a {
  display: block; padding: 7px 9px; border-radius: 6px; color: var(--ink);
  text-decoration: none; margin-bottom: 2px;
}
nav a:hover { background: var(--line); }
nav a.on { background: var(--accent); color: #fff; }
.run { margin: 0 0 16px; }
.run button {
  width: 100%; border: 0; border-radius: 7px; font: inherit; font-weight: 600;
  padding: 11px 12px; cursor: pointer; background: var(--accent); color: #fff;
}
.run button:hover { filter: brightness(1.08); }
nav .where { margin: 18px 8px 0; font: 11px/1.5 var(--mono); color: var(--dim); word-break: break-all; }
main { flex: 1; padding: 26px 30px 70px; min-width: 0; }
h2 { font-size: 21px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 26px 0 8px; }
h4 { font-size: 13px; margin: 16px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.sub { color: var(--dim); margin: 0 0 18px; }
a { color: var(--accent); }
table { border-collapse: collapse; width: auto; max-width: 100%; font-size: 12px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--dim); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
tbody tr.click:hover { background: var(--panel); cursor: pointer; }
.scroll { display: inline-block; max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.scroll table { font-size: 12px; white-space: nowrap; }
.scroll th, .scroll td { padding: 5px 7px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; background: var(--panel); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
  padding: 4px 11px; border-radius: 20px; font-size: 12px; font-family: inherit;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip b { font-weight: 600; opacity: .65; margin-left: 5px; }
.chip-sep { width: 1px; background: var(--line); margin: 2px 2px; align-self: stretch; }
.pager { display: flex; align-items: center; justify-content: flex-start; gap: 12px; padding: 10px 0 4px; }
.pager button {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
  padding: 4px 12px; border-radius: 6px; font: inherit; font-size: 12px;
}
.pager button:hover:not(:disabled) { background: var(--panel); }
.pager button:disabled { opacity: .4; cursor: default; }
.pager span { color: var(--dim); font-size: 12px; }
input[type=search] {
  width: 280px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); font: inherit; margin-bottom: 14px;
}
.badge { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; border: 1px solid var(--line); }
.badge.applied, .badge.interviewing { color: var(--good); border-color: var(--good); }
.badge.shortlisted, .badge.staged { color: var(--accent); border-color: var(--accent); }
.badge.rejected, .badge.blocked { color: var(--bad); border-color: var(--bad); }
.badge.skipped, .badge.not_pursued, .badge.closed { color: var(--dim); }
.score { font-family: var(--mono); font-weight: 600; }
.score.hi { color: var(--good); } .score.mid { color: var(--warn); } .score.lo { color: var(--dim); }
.grid { display: grid; grid-template-columns: 180px 1fr; gap: 3px 16px; font-size: 13px; }
.grid dt { color: var(--dim); }
.grid dd { margin: 0; }
.null { color: var(--bad); font-style: italic; }
.flagged { background: var(--flag); }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; }
.desc { max-height: 460px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
iframe, img.shot { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
iframe { height: 780px; }
ul.tight { margin: 4px 0; padding-left: 20px; }
ul.tight li { margin-bottom: 3px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.tag { font-size: 11px; font-family: var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--dim); }
.empty { color: var(--dim); padding: 20px 0; }
.time { font-family: var(--mono); font-size: 12px; color: var(--dim); }
@media (max-width: 720px) {
  body { flex-direction: column; }
  nav {
    width: auto; min-height: 0; position: static; padding: 14px 14px 10px;
    border-right: 0; border-bottom: 1px solid var(--line);
  }
  nav h1 { margin-left: 2px; }
  nav a { display: inline-block; margin: 0 6px 6px 0; padding: 8px 12px; border: 1px solid var(--line); }
  .run { display: flex; flex-wrap: wrap; gap: 6px; }
  .run button { width: auto; flex: 1 1 auto; }
  nav .where { margin: 10px 2px 0; }
  main { padding: 18px 14px 60px; }
  h2 { font-size: 19px; }
  table.tbl { table-layout: fixed; width: 100%; }
  table.tbl td, table.tbl th { overflow: hidden; text-overflow: ellipsis; }
  table.tbl [data-label="Location"], table.tbl [data-label="Compensation"],
  table.tbl [data-label="Seen"], table.tbl [data-label="Resume"],
  table.tbl [data-label="Slug"],
  table.tbl [data-label="Added via"], table.tbl [data-label="Note"] { display: none; }
  .scroll table:not(.tbl) td { white-space: normal; overflow-wrap: anywhere; }
  table.jobs [data-label="Score"] { width: 14%; }
  table.jobs [data-label="Company"] { width: 30%; }
  table.jobs [data-label="Status"] { width: 22%; }
  .badge { padding: 1px 5px; font-size: 10px; }
  .grid { grid-template-columns: 1fr; gap: 1px 0; }
  .grid dt { margin-top: 8px; }
  input[type=search] { width: 100%; }
  iframe { height: 65vh; }
  .desc { max-height: 320px; }
}
</style>
</head>
<body>
<nav>
  <h1>Job</h1>
  <div class="run">
    <button id="help">? Help</button>
  </div>
  <a href="#/jobs">Jobs</a>
  <a href="#/profile">Profile</a>
  <a href="#/sources">Sources</a>
  <div class="where" id="where"></div>
</nav>
<main id="main"></main>
<script>
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = async (path, params) => {
  const url = new URL(path, location.origin);
  Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
  const response = await fetch(url);
  return response.json();
};
const main = document.getElementById("main");
const show = html => { main.innerHTML = html; window.scrollTo(0, 0); };
const loading = () => show('<p class="empty">Loading…</p>');
const badge = s => s ? `<span class="badge ${esc(s)}">${esc(s)}</span>` : "";
const scoreCell = s => s === null || s === undefined ? '<span class="score lo">—</span>'
  : `<span class="score ${s >= 7 ? "hi" : s >= 4 ? "mid" : "lo"}">${s}</span>`;
const link = (url, label) => url ? `<a href="${esc(url)}" target="_blank" rel="noreferrer">${esc(label || url)}</a>` : "—";
const value = v => v === null || v === undefined || v === "" ? '<span class="null">not answered</span>' : esc(v);
const table = (columns, data, rowAttrs, cls) => data.length ? `<div class="scroll"><table class="tbl${cls ? " " + cls : ""}">
  <thead><tr>${columns.map(c => `<th data-label="${esc(c)}">${esc(c)}</th>`).join("")}</tr></thead>
  <tbody>${data.map(r => `<tr ${rowAttrs ? rowAttrs(r) : ""}>${r.cells.map((c, i) => `<td data-label="${esc(columns[i])}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
</table></div>` : '<p class="empty">Nothing here.</p>';

const PAGE_SIZE = 15;
function pageSlice(rows, state, id) {
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  state.page = Math.min(state.page || 0, pages - 1);
  const start = state.page * PAGE_SIZE;
  const pager = pages > 1 ? `<div class="pager" id="${id}">
      <button data-dir="-1" ${state.page === 0 ? "disabled" : ""}>‹ Prev</button>
      <span>Page ${state.page + 1} of ${pages} · ${rows.length} total</span>
      <button data-dir="1" ${state.page === pages - 1 ? "disabled" : ""}>Next ›</button>
    </div>` : "";
  return { slice: rows.slice(start, start + PAGE_SIZE), pager };
}
function wirePager(id, state, redraw) {
  const el = document.getElementById(id);
  if (el) el.onclick = event => {
    const btn = event.target.closest("button[data-dir]");
    if (btn) { state.page = (state.page || 0) + Number(btn.dataset.dir); redraw(); }
  };
}

let jobs = { rows: [], status: "all", search: "", page: 0 };

async function viewJobs() {
  loading();
  const [data, stats] = await Promise.all([get("/api/jobs"), get("/api/stats")]);
  jobs.rows = data;
  const counts = Object.fromEntries(stats.map(s => [s.status, s.n]));
  const order = ["shortlisted", "staged", "applied", "interviewing", "new", "scored",
                 "skipped", "rejected", "not_pursued", "closed"].filter(s => counts[s]);
  show(`<h2>Jobs</h2>
    <p class="sub">${data.length} prospects. Click a row for the full posting, its history and its resume.</p>
    <input type="search" id="q" placeholder="company, title or location" value="${esc(jobs.search)}">
    <div class="chips" id="chips">
      <button class="chip" data-status="all">all<b>${data.length}</b></button>
      ${order.map(s => `<button class="chip" data-status="${s}">${s}<b>${counts[s]}</b></button>`).join("")}
    </div>
    <div id="rows"></div>`);
  document.getElementById("chips").onclick = event => {
    const chip = event.target.closest(".chip");
    if (chip) { jobs.status = chip.dataset.status; jobs.page = 0; drawJobs(); }
  };
  const box = document.getElementById("q");
  box.oninput = () => { jobs.search = box.value; jobs.page = 0; drawJobs(); };
  drawJobs();
}

function drawJobs() {
  document.querySelectorAll("#chips .chip").forEach(c =>
    c.classList.toggle("on", c.dataset.status === jobs.status));
  const needle = jobs.search.trim().toLowerCase();
  const shown = jobs.rows.filter(r =>
    (jobs.status === "all" || r.status === jobs.status) &&
    (!needle || `${r.company} ${r.title} ${r.location || ""}`.toLowerCase().includes(needle)));
  const { slice, pager } = pageSlice(shown, jobs, "jobsPager");
  document.getElementById("rows").innerHTML = table(
    ["Score", "Company", "Title", "Location", "Compensation", "Status", "Seen", "Resume"],
    slice.map(r => ({ key: r.key, cells: [
      scoreCell(r.score), esc(r.company), esc(r.title),
      esc(r.location || (r.remote ? "Remote" : "—")), esc(r.compensation || "—"),
      badge(r.status), `<span class="time">${esc(r.first_seen || "")}</span>`,
      r.resume ? `<a href="/asset/resume/${encodeURIComponent(r.key)}" target="_blank"
        rel="noreferrer" onclick="event.stopPropagation()">open PDF</a>` : ""] })),
    r => `class="click" onclick="location.hash='#/prospect/${encodeURIComponent(r.key)}'"`,
    "jobs") + pager;
  wirePager("jobsPager", jobs, drawJobs);
}

async function viewProspect(key) {
  loading();
  const p = await get("/api/prospect", { key });
  if (p.error) return show(`<h2>Not found</h2><p class="sub">${esc(p.error)}</p>`);
  const tiers = ["identity", "policy", "judgment"];
  const staged = p.staged ? `<h3>Staged application</h3>
    <div class="card">
      <dl class="grid">
        <dt>Form status</dt><dd>${badge(p.staged.status)}</dd>
        <dt>ATS</dt><dd>${esc(p.staged.ats || "—")}</dd>
        <dt>Apply URL</dt><dd>${link(p.staged.url)}</dd>
        ${p.staged.blocked_on ? `<dt>Blocked on</dt><dd class="null">${esc(p.staged.blocked_on)}</dd>` : ""}
      </dl>
    </div>
    ${tiers.map(tier => {
      const fields = p.fields.filter(f => f.tier === tier);
      if (!fields.length) return "";
      return `<h4>${tier}</h4><div class="scroll"><table><tbody>${fields.map(f => `
        <tr class="${f.flag ? "flagged" : ""}">
          <td style="width:32%">${esc(f.label)}${f.flag ? `<br><span class="time">${esc(f.flag)}</span>` : ""}</td>
          <td class="prose" style="white-space:pre-wrap">${esc(f.value)}</td>
        </tr>`).join("")}</tbody></table></div>`;
    }).join("")}
    ${p.staged.screenshot ? `<h4>Filled form</h4><img class="shot" src="/asset/screenshot/${encodeURIComponent(key)}" alt="">` : ""}`
    : "";
  show(`<p><a href="#/jobs">← Jobs</a></p>
    <h2>${esc(p.company)} — ${esc(p.title)}</h2>
    <p class="sub">${scoreCell(p.score)} · ${badge(p.status)} · <span class="time">${esc(p.key)}</span></p>
    <div class="card"><dl class="grid">
      <dt>Location</dt><dd>${esc(p.location || (p.remote ? "Remote" : "—"))}</dd>
      <dt>Compensation</dt><dd>${esc(p.compensation || "—")}</dd>
      <dt>Posted</dt><dd>${esc(p.posted_at || "—")}</dd>
      <dt>First seen</dt><dd>${esc(p.first_seen || "—")}</dd>
      <dt>Source</dt><dd>${esc(p.source || "—")}${p.ats ? ` · ${esc(p.ats)}` : ""}</dd>
      <dt>Posting</dt><dd>${link(p.url, "open")}</dd>
      <dt>Apply</dt><dd>${link(p.apply_url, "open")}</dd>
      ${p.aliases.length ? `<dt>Also listed as</dt><dd class="time">${p.aliases.map(esc).join("<br>")}</dd>` : ""}
    </dl></div>
    ${p.reason ? `<h3>Why this score</h3><div class="card prose">${esc(p.reason)}</div>` : ""}
    ${staged}
    ${p.resume ? `<h3>Resume</h3><p class="sub time">${esc(p.resume)}</p>
      <iframe src="/asset/resume/${encodeURIComponent(key)}" title="resume"></iframe>` : ""}
    <h3>History</h3>
    ${table(["When", "Status", "Note"], p.events.map(e => ({ cells: [
      `<span class="time">${esc(e.at)}</span>`, badge(e.status), esc(e.note || "")] })))}
    ${p.description ? `<h3>Description</h3><div class="desc prose">${esc(p.description)}</div>` : ""}`);
}

async function viewProfile() {
  loading();
  const [fields, blockers, career, criteria, notes, facts, education, accounts, limits] =
    await Promise.all(["profile", "unanswered", "career", "criteria", "notes", "facts",
                       "education", "accounts", "limits"].map(n => get("/api/" + n)));
  const sections = [...new Set(fields.map(f => f.section))];
  const kinds = [...new Set(criteria.map(c => c.kind))];
  show(`<h2>Profile</h2>
    <p class="sub">Everything an application draws on. Read-only here — corrections go through chat.</p>
    ${blockers.length ? `<div class="card"><h4 style="margin-top:0">Will block an application</h4>
      ${blockers.map(b => `<div class="null">${esc(b.field)}</div>`).join("")}</div>`
      : `<div class="card">No unanswered fields.</div>`}
    ${sections.map(section => `<h3>${esc(section.replace(/_/g, " "))}</h3>
      <dl class="grid">${fields.filter(f => f.section === section).map(f => `
        <dt>${esc(f.field.split(".").slice(1).join(".").replace(/_/g, " "))}</dt>
        <dd>${value(f.value)}${f.notes ? `<br><span class="time">${esc(f.notes)}</span>` : ""}</dd>`).join("")}</dl>`).join("")}
    <h3>Experience</h3>
    ${career.map(e => `<div class="card">
      <b>${esc(e.name)}</b>${e.title ? ` — ${esc(e.title)}` : ""}
      <span class="time"> ${esc(e.start || "")}–${esc(e.current ? "present" : e.finish || "")}</span>
      ${e.context ? `<div class="sub" style="margin:6px 0 0">${esc(e.context)}</div>` : ""}
      ${e.projects.map(p => `<div style="margin-top:14px;padding-left:14px;border-left:2px solid var(--line)">
        <b>${esc(p.name)}</b> ${badge(p.status)}
        <span class="time"> ${esc(p.start || "")}${p.finish ? "–" + esc(p.finish) : ""}</span>
        ${p.shared_with ? `<div class="time">shared with ${esc(p.shared_with)}</div>` : ""}
        ${p.summary ? `<div style="margin-top:4px">${esc(p.summary)}</div>` : ""}
        ${p.bullets.length ? `<ul class="tight">${p.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
        ${p.metrics.length ? `<div><b style="font-size:12px">Metrics</b><ul class="tight">${
          p.metrics.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : ""}
        ${p.links.length ? `<div>${p.links.map(l => link(l.url, l.label)).join(" · ")}</div>` : ""}
        ${p.technologies.length ? `<div class="tags">${p.technologies.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      </div>`).join("")}
    </div>`).join("")}
    <h3>Education</h3>
    ${table(["Degree", "Institution", "Finished"], education.map(e => ({
      cells: [esc(e.degree), esc(e.institution || "—"), esc(e.finished || "—")] })))}
    <h3>Search criteria</h3>
    ${kinds.map(kind => `<h4>${esc(kind.replace(/_/g, " "))}</h4>
      <dl class="grid">${criteria.filter(c => c.kind === kind).map(c => `
        <dt>${esc(c.value)}</dt>
        <dd>${c.weight !== null ? `<span class="score">${c.weight > 0 ? "+" : ""}${c.weight}</span> ` : ""}${esc(c.note || "")}</dd>`).join("")}</dl>`).join("")}
    <h3>Search notes</h3>
    ${notes.map(n => `<div class="card"><h4 style="margin-top:0">${esc(n.topic)}</h4>
      <div class="prose">${esc(n.note)}</div></div>`).join("")}
    <h3>Facts that must never be misreported</h3>
    ${facts.length ? `<ul class="tight">${facts.map(f => `<li>${esc(f.fact)}</li>`).join("")}</ul>`
      : '<p class="empty">None recorded.</p>'}
    <h3>Accounts</h3>
    ${table(["Employer", "System", "Login", "Password lives", "Portal"], accounts.map(a => ({
      cells: [esc(a.employer), esc(a.system || "—"), esc(a.login_email || "—"),
              esc(a.password_location || "—"), link(a.portal_url, "open")] })))}
    <h3>Stated company limits</h3>
    ${table(["Company", "Stated"], limits.map(l => ({ cells: [esc(l.company), esc(l.stated)] })))}`);
}

const dueDays = { Weekly: 7, Monthly: 30, Quarterly: 91 };
const overdue = c => {
  if (c.ats !== "manual") return "—";
  if (!c.last_checked) return "never checked";
  const days = Math.floor((Date.now() - Date.parse(c.last_checked)) / 86400000);
  return days >= (dueDays[c.cadence] || 30) ? `${days}d — due` : `${days}d ago`;
};

let sources = { rows: [], ats: "all", active: "all", search: "", page: 0 };

async function viewSources() {
  loading();
  sources.rows = await get("/api/companies");
  const atsCounts = {};
  sources.rows.forEach(c => atsCounts[c.ats] = (atsCounts[c.ats] || 0) + 1);
  const atsOrder = Object.keys(atsCounts).sort((a, b) => atsCounts[b] - atsCounts[a]);
  const dueCount = sources.rows.filter(c => overdue(c).includes("due") || overdue(c) === "never checked").length;
  show(`<h2>Sources</h2>
    <p class="sub">${sources.rows.filter(c => c.active).length} active boards of ${sources.rows.length} tracked.</p>
    <input type="search" id="q" placeholder="company" value="${esc(sources.search)}">
    <div class="chips" id="chips">
      <button class="chip" data-ats="all">all<b>${sources.rows.length}</b></button>
      ${atsOrder.map(a => `<button class="chip" data-ats="${esc(a)}">${esc(a)}<b>${atsCounts[a]}</b></button>`).join("")}
      <span class="chip-sep"></span>
      <button class="chip" data-active="due">due to check<b>${dueCount}</b></button>
      <button class="chip" data-active="inactive">inactive<b>${sources.rows.filter(c => !c.active).length}</b></button>
    </div>
    <div id="rows"></div>`);
  document.getElementById("chips").onclick = event => {
    const chip = event.target.closest(".chip");
    if (!chip) return;
    if (chip.dataset.ats) sources.ats = chip.dataset.ats;
    else if (chip.dataset.active) sources.active = sources.active === chip.dataset.active ? "all" : chip.dataset.active;
    sources.page = 0;
    drawSources();
  };
  const box = document.getElementById("q");
  box.oninput = () => { sources.search = box.value; sources.page = 0; drawSources(); };
  drawSources();
}

function drawSources() {
  document.querySelectorAll("#chips .chip").forEach(c =>
    c.classList.toggle("on", c.dataset.ats ? c.dataset.ats === sources.ats : c.dataset.active === sources.active));
  const needle = sources.search.trim().toLowerCase();
  const shown = sources.rows.filter(c =>
    (sources.ats === "all" || c.ats === sources.ats) &&
    (sources.active === "all" || (sources.active === "inactive" ? !c.active :
      overdue(c).includes("due") || overdue(c) === "never checked")) &&
    (!needle || c.name.toLowerCase().includes(needle)));
  const { slice, pager } = pageSlice(shown, sources, "sourcesPager");
  document.getElementById("rows").innerHTML = table(
    ["Source", "Company", "Cadence", "Last checked", "Active", "Careers"],
    slice.map(c => {
      const ov = overdue(c);
      return { cells: [
        `<span class="time">${esc(c.ats)}</span>`, esc(c.name), esc(c.cadence || "—"),
        `<span class="${ov.includes("due") || ov === "never checked" ? "null" : (ov === "—" ? "time" : "")}">${esc(ov)}</span>`,
        c.active ? "✓" : '<span class="null">off</span>',
        link(c.careers_url, "open")] };
    })) + pager;
  wirePager("sourcesPager", sources, drawSources);
}

async function viewHelp() {
  loading();
  const result = await get("/api/help");
  if (result.error) return show(`<h2>Help</h2><p class="sub null">${esc(result.error)}</p>`);
  show(`<h2>Job commands</h2>
    <p class="sub">Everything here runs from a terminal, typed into Claude Code.</p>
    <pre class="prose">${esc(result.text)}</pre>`);
}

document.getElementById("help").onclick = () => { location.hash = "#/help"; };

const routes = { jobs: viewJobs, profile: viewProfile, sources: viewSources, help: viewHelp };

function route() {
  const [, name, arg] = location.hash.split("/");
  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === `#/${name}`));
  if (name === "prospect") return viewProspect(decodeURIComponent(arg || ""));
  (routes[name] || viewJobs)();
}

window.addEventListener("hashchange", route);
get("/api/where").then(w => { document.getElementById("where").textContent = w.db; });
route();
</script>
</body>
</html>
