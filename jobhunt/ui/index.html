<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job dashboard</title>
<style>
:root {
  color-scheme: dark;   /* dark, not "whatever the OS says": the scrollbars, the
                           select menus and the text carets follow it too */
  --bg: #131316; --panel: #1b1b1f; --line: #2c2c32; --ink: #e8e8ea; --dim: #9a9aa4;
  --accent: #7aa2f7; --good: #5cc98d; --warn: #e0b34a; --bad: #f07a71; --flag: #3a3116;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); display: flex;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
nav {
  width: 190px; min-height: 100vh; padding: 20px 12px; border-right: 1px solid var(--line);
  background: var(--panel); position: sticky; top: 0; flex: none;
}
nav h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin: 0 0 14px 8px; }
nav a {
  display: block; padding: 7px 9px; border-radius: 6px; color: var(--ink);
  text-decoration: none; margin-bottom: 2px;
}
nav a:hover { background: var(--line); }
nav a.on { background: var(--accent); color: var(--bg); }
.run { margin: 0 0 16px; }
.run button {
  width: 100%; border: 0; border-radius: 7px; font: inherit; font-weight: 600;
  padding: 11px 12px; cursor: pointer; background: var(--accent); color: var(--bg);
}
.run button:hover { filter: brightness(1.08); }
nav .where { margin: 18px 8px 0; font: 11px/1.5 var(--mono); color: var(--dim); word-break: break-all; }
main { flex: 1; padding: 26px 30px 70px; min-width: 0; }
h2 { font-size: 21px; margin: 0 0 4px; }
h3 { font-size: 15px; margin: 26px 0 8px; }
h4 { font-size: 13px; margin: 16px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.sub { color: var(--dim); margin: 0 0 18px; }
a { color: var(--accent); }
table { border-collapse: collapse; width: auto; max-width: 100%; font-size: 12px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--dim); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
tbody tr.click:hover { background: var(--panel); cursor: pointer; }
.scroll { display: inline-block; max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.scroll table { font-size: 12px; white-space: nowrap; }
.scroll th, .scroll td { padding: 5px 7px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; background: var(--panel); }
.card > h4:first-child { margin-top: 0; }
.card .sub { margin: 6px 0 0; }
.project { margin-top: 18px; padding-left: 14px; border-left: 2px solid var(--line); }
.fields td:first-child { width: 32%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
  padding: 4px 11px; border-radius: 20px; font-size: 12px; font-family: inherit;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.chip b { font-weight: 600; opacity: .65; margin-left: 5px; }
.chip-sep { width: 1px; background: var(--line); margin: 2px 2px; align-self: stretch; }
.pager { display: flex; align-items: center; justify-content: flex-start; gap: 12px; padding: 10px 0 4px; }
.pager button {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
  padding: 4px 12px; border-radius: 6px; font: inherit; font-size: 12px;
}
.pager button:hover:not(:disabled) { background: var(--panel); }
.pager button:disabled { opacity: .4; cursor: default; }
.pager span { color: var(--dim); font-size: 12px; }
input[type=search] {
  width: 280px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); font: inherit; margin-bottom: 14px;
}
.badge { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; border: 1px solid var(--line); }
.badge.applied, .badge.interviewing { color: var(--good); border-color: var(--good); }
.badge.shortlisted, .badge.staged { color: var(--accent); border-color: var(--accent); }
.badge.rejected, .badge.blocked { color: var(--bad); border-color: var(--bad); }
.badge.skipped, .badge.not_pursued, .badge.closed { color: var(--dim); }
.score { font-family: var(--mono); font-weight: 600; }
.score.hi { color: var(--good); } .score.mid { color: var(--warn); } .score.lo { color: var(--dim); }
.grid { display: grid; grid-template-columns: 180px 1fr; gap: 3px 16px; font-size: 13px; }
.grid dt { color: var(--dim); }
.grid dd { margin: 0; }
.null { color: var(--bad); font-style: italic; }
.flagged { background: var(--flag); }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; }
.desc { max-height: 460px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
iframe, img.shot { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
iframe { height: 780px; }
.empty { color: var(--dim); padding: 20px 0; }

/* Editing. Every box writes one column of one row the moment it loses focus,
   so there is no save button to forget and no draft to lose. */
.b {
  font: inherit; font-size: 12px; padding: 4px 6px; width: 22ch;
  border: 1px solid var(--line); border-radius: 5px;
  background: var(--bg); color: var(--ink);
}
.b:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
textarea.b { width: 46ch; min-height: 2.4em; resize: vertical; vertical-align: top; }
select.b { width: auto; }
[data-row].want:placeholder-shown { border-color: var(--bad); background: var(--flag); }
table.edit td { padding: 3px 4px; }
table.edit tr.new td { border-bottom: 0; }
table.edit tr.new .b { opacity: .75; }
table.edit tr.new .b:focus { opacity: 1; }
.x {
  border: 1px solid var(--line); background: var(--bg); color: var(--dim);
  border-radius: 5px; cursor: pointer; font: inherit; line-height: 1; padding: 4px 8px;
}
.x:hover { color: var(--bad); border-color: var(--bad); }
.x.add:hover { color: var(--good); border-color: var(--good); }
.grid dd .b { width: 30ch; }
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 9;
  background: var(--ink); color: var(--bg); opacity: 0; transition: opacity .2s;
  pointer-events: none; max-width: 80vw;
}
#toast.on { opacity: .94; }
#toast.bad { background: var(--bad); color: var(--bg); }
.time { font-family: var(--mono); font-size: 12px; color: var(--dim); }
@media (max-width: 720px) {
  body { flex-direction: column; }
  nav {
    width: auto; min-height: 0; position: static; padding: 14px 14px 10px;
    border-right: 0; border-bottom: 1px solid var(--line);
  }
  nav h1 { margin-left: 2px; }
  nav a { display: inline-block; margin: 0 6px 6px 0; padding: 8px 12px; border: 1px solid var(--line); }
  .run { display: flex; flex-wrap: wrap; gap: 6px; }
  .run button { width: auto; flex: 1 1 auto; }
  nav .where { margin: 10px 2px 0; }
  main { padding: 18px 14px 60px; }
  h2 { font-size: 19px; }
  table.tbl { table-layout: fixed; width: 100%; }
  table.tbl td, table.tbl th { overflow: hidden; text-overflow: ellipsis; }
  table.tbl [data-label="Location"], table.tbl [data-label="Compensation"],
  table.tbl [data-label="Seen"], table.tbl [data-label="Resume"],
  table.tbl [data-label="Slug"],
  table.tbl [data-label="Added via"], table.tbl [data-label="Note"] { display: none; }
  .scroll table:not(.tbl) td { white-space: normal; overflow-wrap: anywhere; }
  table.jobs [data-label="Score"] { width: 14%; }
  table.jobs [data-label="Company"] { width: 30%; }
  table.jobs [data-label="Status"] { width: 22%; }
  .badge { padding: 1px 5px; font-size: 10px; }
  .grid { grid-template-columns: 1fr; gap: 1px 0; }
  .grid dt { margin-top: 8px; }
  input[type=search] { width: 100%; }
  .b, textarea.b, .grid dd .b { width: 100%; }
  iframe { height: 65vh; }
  .desc { max-height: 320px; }
}
</style>
</head>
<body>
<nav>
  <h1>Job</h1>
  <div class="run">
    <button id="help">? Help</button>
  </div>
  <a href="#/jobs">Jobs</a>
  <a href="#/profile">Profile</a>
  <a href="#/sources">Sources</a>
  <div class="where" id="where"></div>
</nav>
<main id="main"></main>
<div id="toast"></div>
<script>
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = async (path, params) => {
  const url = new URL(path, location.origin);
  Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
  // no-store: the page writes now, so a read must never come back from the
  // browser's cache showing what the database said before the last edit.
  const response = await fetch(url, { cache: "no-store" });
  return response.json();
};
const main = document.getElementById("main");
const show = html => { main.onclick = null; main.innerHTML = html; window.scrollTo(0, 0); };
const loading = () => show('<p class="empty">Loading…</p>');
const badge = s => s ? `<span class="badge ${esc(s)}">${esc(s)}</span>` : "";
const scoreCell = s => s === null || s === undefined ? '<span class="score lo">—</span>'
  : `<span class="score ${s >= 7 ? "hi" : s >= 4 ? "mid" : "lo"}">${s}</span>`;
const link = (url, label) => url ? `<a href="${esc(url)}" target="_blank" rel="noreferrer">${esc(label || url)}</a>` : "—";
const all = (items, fn) => items.map(fn).join("");
const toast = document.getElementById("toast");
const say = (message, bad) => {
  toast.textContent = message;
  toast.className = "on" + (bad ? " bad" : "");
  clearTimeout(say.timer);
  say.timer = setTimeout(() => { toast.className = ""; }, bad ? 6000 : 1400);
};
const send = async (path, options) => {
  const result = await fetch(path, options).then(r => r.json(), e => ({ error: String(e) }));
  say(result.error || (result.deleted ? "deleted" : "saved"), !!result.error);
  return !result.error;
};
const put = (table, rowid, values) => send("/api/edit/" + table, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ rowid, values }),
});
const when = (cond, html) => cond ? (typeof html === "function" ? html() : html) : "";
const card = inner => `<div class="card">${inner}</div>`;
const grid = pairs => `<dl class="grid">${all(pairs.filter(Boolean),
  ([k, v, cls]) => `<dt>${k}</dt><dd${cls ? ` class="${cls}"` : ""}>${v}</dd>`)}</dl>`;
const section = (title, html) => `<h3>${esc(title)}</h3>${html}`;
const table = (columns, data, rowAttrs, cls) => data.length ? `<div class="scroll"><table class="tbl${cls ? " " + cls : ""}">
  <thead><tr>${columns.map(c => `<th data-label="${esc(c)}">${esc(c)}</th>`).join("")}</tr></thead>
  <tbody>${data.map(r => `<tr ${rowAttrs ? rowAttrs(r) : ""}>${r.cells.map((c, i) => `<td data-label="${esc(columns[i])}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
</table></div>` : '<p class="empty">Nothing here.</p>';

// One box, bound to one column of one row. Blank means NULL, which is what an
// unanswered profile field is, so clearing a box is how the user takes an
// answer back. A row of "" is the blank row that adds a new one.
let VOCAB = {};   // the CHECK vocabularies, so a constrained column is a menu
const title = col => esc(col.label || col.name.replace(/_/g, " "));
const box = (table, row, col, v) => {
  const attrs = `class="b${col.want ? " want" : ""}" data-table="${esc(table)}"` +
    ` data-col="${esc(col.name)}" placeholder="${title(col)}"` +
    (row === "" ? "" : ` data-row="${row}"`);
  const options = col.options || VOCAB[col.vocab];
  if (options) return `<select ${attrs}>${all(
    (col.required ? [] : [["", ""]]).concat(options.map(o => Array.isArray(o) ? o : [o, o])),
    ([o, text]) => `<option value="${esc(o)}"${o === String(v ?? "") ? " selected" : ""}>${esc(text)}</option>`)}</select>`;
  if (col.area) return `<textarea ${attrs} rows="2">${esc(v ?? "")}</textarea>`;
  return `<input ${attrs} value="${esc(v ?? "")}">`;
};

const drop = (table, row) => `<button class="x" data-drop="${esc(table)}/${row}" title="delete">×</button>`;
// `blank` seeds the new row: what the user types over, plus the columns it
// inherits without seeing them, like the project a bullet belongs to.
const adder = (table, blank) =>
  `<button class="x add" data-add="${esc(table)}" data-blank='${esc(JSON.stringify(blank))}' title="add">+</button>`;
const boxes = (table, row, cols) =>
  grid(cols.map(c => [title(c), box(table, row.rowid, c, row[c.name])]));

// A table that writes through: every cell saves itself, × removes the row, and
// the last row is empty and waiting to become a new one.
const editable = (table, cols, rows, blank = {}) => `<div class="scroll"><table class="tbl edit">
  <thead><tr>${all(cols, c => `<th>${title(c)}</th>`)}<th></th></tr></thead>
  <tbody>${all(rows, r => `<tr>${all(cols, c => `<td>${box(table, r.rowid, c, r[c.name])}</td>`)}
      <td>${drop(table, r.rowid)}</td></tr>`)}
    <tr class="new">${all(cols, c => `<td>${box(table, "", c, blank[c.name])}</td>`)}
      <td>${adder(table, blank)}</td></tr></tbody>
</table></div>`;

main.addEventListener("change", event => {
  const cell = event.target.closest("[data-row][data-col]");
  if (cell) put(cell.dataset.table, Number(cell.dataset.row), { [cell.dataset.col]: cell.value });
});

main.addEventListener("click", async event => {
  const add = event.target.closest("button[data-add]");
  const gone = event.target.closest("button[data-drop]");
  if (add) {
    const values = JSON.parse(add.dataset.blank);
    add.closest("tr.new").querySelectorAll("[data-col]").forEach(b => values[b.dataset.col] = b.value);
    if (await put(add.dataset.add, null, values)) route();
  } else if (gone && confirm("Delete this row? It is gone from the profile for good.")) {
    if (await send("/api/edit/" + gone.dataset.drop, { method: "DELETE" })) route();
  }
});

const PAGE_SIZE = 15;

function listView(state, spec) {
  const draw = () => {
    document.querySelectorAll("#chips .chip").forEach(
      c => c.classList.toggle("on", spec.selected(c.dataset, state)));
    const needle = state.search.trim().toLowerCase();
    const shown = state.rows.filter(r => spec.match(r, state, needle));
    const pages = Math.max(1, Math.ceil(shown.length / PAGE_SIZE));
    state.page = Math.min(state.page, pages - 1);
    const start = state.page * PAGE_SIZE;
    document.getElementById("rows").innerHTML =
      table(spec.columns, shown.slice(start, start + PAGE_SIZE).map(spec.row),
            spec.rowAttrs, spec.cls) +
      when(pages > 1, `<div class="pager">
        <button data-dir="-1" ${state.page === 0 ? "disabled" : ""}>‹ Prev</button>
        <span>Page ${state.page + 1} of ${pages} · ${shown.length} total</span>
        <button data-dir="1" ${state.page === pages - 1 ? "disabled" : ""}>Next ›</button>
      </div>`);
  };
  show(`<h2>${esc(spec.title)}</h2>
    <p class="sub">${spec.sub}</p>
    <input type="search" id="q" placeholder="${esc(spec.placeholder)}" value="${esc(state.search)}">
    <div class="chips" id="chips">${spec.chips}</div>
    <div id="rows"></div>`);
  main.onclick = event => {
    const chip = event.target.closest("#chips .chip");
    const step = event.target.closest(".pager button[data-dir]");
    if (chip) { spec.pick(chip.dataset, state); state.page = 0; draw(); }
    else if (step) { state.page += Number(step.dataset.dir); draw(); }
  };
  document.getElementById("q").oninput = event => {
    state.search = event.target.value; state.page = 0; draw();
  };
  draw();
}

const STATUS_ORDER = ["shortlisted", "staged", "applied", "interviewing", "new", "scored",
                      "skipped", "rejected", "not_pursued", "closed"];
const jobs = { rows: [], status: "all", search: "", page: 0 };

async function viewJobs() {
  loading();
  const [rows, stats] = await Promise.all([get("/api/jobs"), get("/api/stats")]);
  jobs.rows = rows;
  const counts = Object.fromEntries(stats.map(s => [s.status, s.n]));
  listView(jobs, {
    title: "Jobs",
    sub: `${rows.length} prospects. Click a row for the full posting, its history and its resume.`,
    placeholder: "company, title or location",
    chips: `<button class="chip" data-status="all">all<b>${rows.length}</b></button>` +
      all(STATUS_ORDER.filter(s => counts[s]),
          s => `<button class="chip" data-status="${s}">${s}<b>${counts[s]}</b></button>`),
    selected: (d, s) => d.status === s.status,
    pick: (d, s) => { s.status = d.status; },
    match: (r, s, needle) => (s.status === "all" || r.status === s.status) &&
      (!needle || `${r.company} ${r.title} ${r.location || ""}`.toLowerCase().includes(needle)),
    columns: ["Score", "Company", "Title", "Location", "Compensation", "Status", "Seen", "Resume"],
    row: r => ({ key: r.key, cells: [
      scoreCell(r.score), esc(r.company), esc(r.title),
      esc(r.location || (r.remote ? "Remote" : "—")), esc(r.compensation || "—"),
      badge(r.status), `<span class="time">${esc(r.first_seen || "")}</span>`,
      when(r.resume, `<a href="/asset/resume/${encodeURIComponent(r.key)}" target="_blank"
        rel="noreferrer" onclick="event.stopPropagation()">open PDF</a>`)] }),
    rowAttrs: r => `class="click" onclick="location.hash='#/prospect/${encodeURIComponent(r.key)}'"`,
    cls: "jobs",
  });
}

async function viewProspect(key) {
  loading();
  const p = await get("/api/prospect", { key });
  if (p.error) return show(`<h2>Not found</h2><p class="sub">${esc(p.error)}</p>`);
  const staged = when(p.staged, () => section("Staged application",
    card(grid([
      ["Form status", badge(p.staged.status)],
      ["ATS", esc(p.staged.ats || "—")],
      ["Apply URL", link(p.staged.url)],
      p.staged.blocked_on && ["Blocked on", esc(p.staged.blocked_on), "null"],
    ])) +
    all(["identity", "policy", "judgment"], tier => {
      const fields = p.fields.filter(f => f.tier === tier);
      return when(fields.length, `<h4>${tier}</h4><div class="scroll"><table class="fields"><tbody>${
        all(fields, f => `<tr class="${f.flag ? "flagged" : ""}">
          <td>${esc(f.label)}${when(f.flag, `<br><span class="time">${esc(f.flag)}</span>`)}</td>
          <td class="prose">${esc(f.value)}</td></tr>`)}</tbody></table></div>`);
    }) +
    when(p.staged.screenshot,
         `<h4>Filled form</h4><img class="shot" src="/asset/screenshot/${encodeURIComponent(key)}" alt="">`)));
  show(`<p><a href="#/jobs">← Jobs</a></p>
    <h2>${esc(p.company)} — ${esc(p.title)}</h2>
    <p class="sub">${scoreCell(p.score)} · ${badge(p.status)} · <span class="time">${esc(p.key)}</span></p>
    ${card(grid([
      ["Location", esc(p.location || (p.remote ? "Remote" : "—"))],
      ["Compensation", esc(p.compensation || "—")],
      ["Posted", esc(p.posted_at || "—")],
      ["First seen", esc(p.first_seen || "—")],
      ["Source", esc(p.source || "—") + when(p.ats, ` · ${esc(p.ats)}`)],
      ["Posting", link(p.url, "open")],
      ["Apply", link(p.apply_url, "open")],
      p.aliases.length && ["Also listed as", p.aliases.map(esc).join("<br>"), "time"],
    ]))}
    ${when(p.reason, () => section("Why this score", `<div class="card prose">${esc(p.reason)}</div>`))}
    ${staged}
    ${when(p.resume, () => section("Resume", `<p class="sub time">${esc(p.resume)}</p>
      <iframe src="/asset/resume/${encodeURIComponent(key)}" title="resume"></iframe>`))}
    ${section("History", table(["When", "Status", "Note"], p.events.map(e => ({ cells: [
      `<span class="time">${esc(e.at)}</span>`, badge(e.status), esc(e.note || "")] }))))}
    ${when(p.description, () => section("Description", `<div class="desc prose">${esc(p.description)}</div>`))}`);
}

const COLS = {
  profile: [{ name: "field" }, { name: "value", want: true }, { name: "notes" }],
  education: [{ name: "degree" }, { name: "institution" }, { name: "finished" }],
  employers: [{ name: "name", label: "employer" }, { name: "title" }, { name: "start" },
              { name: "finish" }, { name: "current", options: [["0", "no"], ["1", "yes"]],
                                    required: true },
              { name: "context", area: true }, { name: "seq", label: "order" }],
  projects: [{ name: "name", label: "project" }, { name: "start" }, { name: "finish" },
             { name: "status", vocab: "projects.status" }, { name: "summary", area: true },
             { name: "shared_with" }, { name: "notes", area: true }, { name: "seq", label: "order" }],
  project_bullets: [{ name: "text", label: "bullet", area: true }, { name: "seq", label: "order" }],
  project_technologies: [{ name: "technology" }],
  project_metrics: [{ name: "metric", area: true }],
  project_links: [{ name: "label" }, { name: "url" }],
  search_criteria: [{ name: "kind", vocab: "search_criteria.kind" }, { name: "value" },
                    { name: "weight" }, { name: "note" }, { name: "seq", label: "order" }],
  search_notes: [{ name: "topic" }, { name: "note", area: true }],
  facts: [{ name: "fact", area: true }],
  accounts: [{ name: "employer" }, { name: "system" }, { name: "login_email" },
             { name: "password_location" }, { name: "portal_url" }],
  company_limits: [{ name: "company" }, { name: "stated", area: true }],
};

async function viewProfile() {
  loading();
  const [fields, career, criteria, notes, facts, education, accounts, limits, vocabulary] =
    await Promise.all(["profile", "career", "criteria", "notes", "facts", "education",
                       "accounts", "limits", "vocabulary"].map(n => get("/api/" + n)));
  VOCAB = vocabulary;
  const sections = VOCAB["profile.section"];
  const blocking = fields.filter(f => f.value === null);
  const project = p => `<div class="project">
    ${boxes("projects", p, COLS.projects)} ${drop("projects", p.rowid)}
    <h4>Bullets — the only sentences a resume may draw on</h4>
    ${editable("project_bullets", COLS.project_bullets, p.bullets, { project_id: p.rowid })}
    <h4>Technologies</h4>
    ${editable("project_technologies", COLS.project_technologies, p.technologies, { project_id: p.rowid })}
    <h4>Metrics</h4>
    ${editable("project_metrics", COLS.project_metrics, p.metrics, { project_id: p.rowid })}
    <h4>Links</h4>
    ${editable("project_links", COLS.project_links, p.links, { project_id: p.rowid })}
  </div>`;
  show(`<h2>Profile</h2>
    <p class="sub">Everything an application draws on, and yours to change here.
      A box saves the moment you leave it; emptying one takes the answer back.</p>
    ${card(blocking.length
      ? `<h4>Unanswered — each one stops an application that asks for it</h4>
         ${all(blocking, b => `<div class="null">${esc(b.field)}</div>`)}`
      : "No unanswered fields.")}
    ${all(sections, sec => section(sec.replace(/_/g, " "),
      editable("profile", COLS.profile, fields.filter(f => f.section === sec),
               { field: sec + "." })))}
    ${section("Experience", all(career, e => card(
      boxes("employers", e, COLS.employers) + " " + drop("employers", e.rowid) +
      all(e.projects, project) +
      `<h4>Add a project</h4>${editable("projects", COLS.projects, [], { employer_id: e.rowid })}`)))}
    ${card(`<h4>Add an employer</h4>${editable("employers", COLS.employers, [])}`)}
    ${section("Education", editable("education", COLS.education, education))}
    ${section("Search criteria", editable("search_criteria", COLS.search_criteria, criteria))}
    ${section("Search notes", editable("search_notes", COLS.search_notes, notes))}
    ${section("Facts that must never be misreported", editable("facts", COLS.facts, facts))}
    ${section("Accounts", editable("accounts", COLS.accounts, accounts))}
    ${section("Stated company limits", editable("company_limits", COLS.company_limits, limits))}`);
}

const dueDays = { Weekly: 7, Monthly: 30, Quarterly: 91 };
const overdue = c => {
  if (c.ats !== "manual") return "—";
  if (!c.last_checked) return "never checked";
  const days = Math.floor((Date.now() - Date.parse(c.last_checked)) / 86400000);
  return days >= (dueDays[c.cadence] || 30) ? `${days}d — due` : `${days}d ago`;
};
const isDue = c => { const o = overdue(c); return o.includes("due") || o === "never checked"; };

const sources = { rows: [], ats: "all", active: "all", search: "", page: 0 };

async function viewSources() {
  loading();
  sources.rows = await get("/api/companies");
  const counts = {};
  sources.rows.forEach(c => counts[c.ats] = (counts[c.ats] || 0) + 1);
  listView(sources, {
    title: "Sources",
    sub: `${sources.rows.filter(c => c.active).length} active boards of ${sources.rows.length} tracked.`,
    placeholder: "company",
    chips: `<button class="chip" data-ats="all">all<b>${sources.rows.length}</b></button>` +
      all(Object.keys(counts).sort((a, b) => counts[b] - counts[a]),
          a => `<button class="chip" data-ats="${esc(a)}">${esc(a)}<b>${counts[a]}</b></button>`) +
      `<span class="chip-sep"></span>
      <button class="chip" data-active="due">due to check<b>${sources.rows.filter(isDue).length}</b></button>
      <button class="chip" data-active="inactive">inactive<b>${sources.rows.filter(c => !c.active).length}</b></button>`,
    selected: (d, s) => d.ats ? d.ats === s.ats : d.active === s.active,
    pick: (d, s) => {
      if (d.ats) s.ats = d.ats;
      else s.active = s.active === d.active ? "all" : d.active;
    },
    match: (c, s, needle) => (s.ats === "all" || c.ats === s.ats) &&
      (s.active === "all" || (s.active === "inactive" ? !c.active : isDue(c))) &&
      (!needle || c.name.toLowerCase().includes(needle)),
    columns: ["Source", "Company", "Cadence", "Last checked", "Active", "Careers"],
    row: c => ({ cells: [
      `<span class="time">${esc(c.ats)}</span>`, esc(c.name), esc(c.cadence || "—"),
      `<span class="${isDue(c) ? "null" : (overdue(c) === "—" ? "time" : "")}">${esc(overdue(c))}</span>`,
      c.active ? "✓" : '<span class="null">off</span>',
      link(c.careers_url, "open")] }),
  });
}

async function viewHelp() {
  loading();
  const result = await get("/api/help");
  if (result.error) return show(`<h2>Help</h2><p class="sub null">${esc(result.error)}</p>`);
  show(`<h2>Job commands</h2>
    <p class="sub">Everything here runs from a terminal, typed into Claude Code.</p>
    <pre class="prose">${esc(result.text)}</pre>`);
}

document.getElementById("help").onclick = () => { location.hash = "#/help"; };

const routes = { jobs: viewJobs, profile: viewProfile, sources: viewSources, help: viewHelp };

function route() {
  const [, name, arg] = location.hash.split("/");
  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === `#/${name}`));
  if (name === "prospect") return viewProspect(decodeURIComponent(arg || ""));
  (routes[name] || viewJobs)();
}

window.addEventListener("hashchange", route);
get("/api/where").then(w => { document.getElementById("where").textContent = w.db; });
route();
</script>
</body>
</html>
