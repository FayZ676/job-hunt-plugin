# Which companies to watch, and the mechanical filters applied to every posting.
# Judgement lives in search-profile.md; this file is the cheap pass that runs first.
#
# Regexes are TOML literal strings (single quotes), so backslashes are written once:
#   '(?i)\b(ai|ml)\b'      not   "(?i)\\b(ai|ml)\\b"

max_age_days = 30

# A posting's title must match at least one of these...
title_include = [
  '(?i)\b(ai|ml|llm|llms|genai|nlp|rag)\b',
  "(?i)machine learning|deep learning|generative ai|applied scien|research engineer|research scien|foundation model|language model|inference|evaluation",
]

# ...and none of these.
title_exclude = [
  '(?i)\b(intern|internship|apprentice|new grad|university grad|working student|co-op)\b',
  '(?i)\b(manager|director|head of|vp|vice president|chief|president)\b',
  '(?i)\b(sales|account executive|seller|recruiter|recruiting|sourcer|marketing|counsel|legal|paralegal|accountant|controller|payroll|people ops|workplace|facilities|executive assistant)\b',
  '(?i)\b(hardware|mechanical|electrical|firmware|technician|manufacturing|optical|robotics technician|vehicle operator|driver)\b',
  '(?i)\b(designer|ux researcher|content strategist|copywriter|technical writer)\b',
  '(?i)\b(support|success|sales engineer|implementation|onboarding specialist)\b',
  '(?i)\b(gtm|go-to-market|strategic finance|transformation owner|partner engineer)\b',
  '(?i)\b(adoption lead|transformation lead|deployment lead|ai strategist|enablement|ecosystem architect|growth marketer|rvp|regional vice president|deal desk|post-doctoral|postdoctoral)\b',
]

# Location must match one of these. Replace the metro line with your own,
# or delete it to search remote-only.
location_include = [
  "(?i)remote",
  '(?i)\b(YOUR_CITY|YOUR_SUBURB|YOUR_AIRPORT_CODE)\b',
  '(?i)YOUR_STATE|,\s*XX\b',
  '(?i)united states|u\.s\.|\busa\b|anywhere|distributed',
]

# ...and none of these. Assumes a US-based search; invert if that isn't you.
location_exclude = [
  '(?i)\b(canada|ontario|toronto|vancouver, ?bc|british columbia|quebec|montreal)\b',
  '(?i)\b(united kingdom|uk|london|ireland|dublin|germany|berlin|munich|france|paris|netherlands|amsterdam|spain|poland|portugal|israel|tel aviv)\b',
  '(?i)\b(india|delhi|bangalore|bengaluru|japan|tokyo|singapore|australia|sydney|brazil|são paulo|sao paulo|mexico|emea|apac|latam)\b',
]

# Tokens that mark a posting as US-based when the location string is vague.
us_tokens = [
  '(?i)\b(us|u\.s\.|usa|united states)\b',
  '(?i)portland|oregon|,\s*OR\b',
]

