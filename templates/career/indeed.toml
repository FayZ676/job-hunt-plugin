# The Indeed pass: what to search for, and what to throw away.
# Mirror the titles from search-profile.md. The pass runs by real page navigation,
# which is not rate-limited, so there is no query budget to ration.

fromage_days = 7   # only postings this recent
comp_floor = 100000     # drop anything advertising below this
delay_ms = 3000        # pause between page loads

# Where to search. Replace with your own metro, or keep Remote only.
locations = [
  { label = "Remote", l = "Remote" },
  { label = "Your metro", l = "City, ST", radius = 35 },
]

queries_remote = [
  '"ai engineer"',
  '"machine learning engineer"',
  '"applied ai"',
  '"applied scientist"',
  '"llm engineer"',
  '"generative ai engineer"',
  '"research engineer"',
  '"forward deployed"',
  '"developer advocate"',
  '"agentic ai"',
  '"nlp engineer"',
  '"solutions architect" ai',
]

queries_local = [
  '"machine learning"',
  '"artificial intelligence"',
  '"ai engineer"',
  '"data scientist" llm',
]

